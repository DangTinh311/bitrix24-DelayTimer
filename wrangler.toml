#:schema node_modules/wrangler/config-schema.json
name = "bitrix24-delay-timer"
main = "src/index.ts"
compatibility_date = "2024-11-27"
compatibility_flags = ["nodejs_compat"]

# Workers AI binding (for future enhancements)
# [ai]
# binding = "AI"

# KV for storing temporary delay states
[[kv_namespaces]]
binding = "DELAY_TIMER_KV"
id = "your_kv_namespace_id"
preview_id = "your_preview_kv_namespace_id"

# Durable Objects for complex delay management
[[durable_objects.bindings]]
name = "DELAY_TIMER_DURABLE"
class_name = "DelayTimerDurable"

# Queue for handling delay processing
[[queues.producers]]
binding = "DELAY_QUEUE"
queue = "delay-processing-queue"

[[queues.consumers]]
queue = "delay-processing-queue"
max_batch_size = 10
max_batch_timeout = 30

# Environment variables
[vars]
ENVIRONMENT = "development"
MAX_DELAY_HOURS = "24"
DEFAULT_DELAY_SECONDS = "30"

# Production environment
[env.production]
name = "bitrix24-delay-timer-prod"
vars = { ENVIRONMENT = "production" }

# Development environment (preview)
[env.staging]
name = "bitrix24-delay-timer-staging"
vars = { ENVIRONMENT = "staging" }

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_classes = [ "DelayTimerDurable" ]

# Custom domains (configure after deployment)
# [[route]]
# pattern = "delay-timer.yourdomain.com/*"
# custom_domain = true